# spacktivate .
# spack install --only dependencies
# will build the env needed but not isntall pychm
spack:
  specs:
    - "py-numpy@1.26:"
    - "py-xarray@2025: +io +viz +parallel"
    - "py-uxarray"
    - "py-netcdf4"
    - "py-pandas"
    - "py-geopandas"
    - "utf8proc"
    - "gdal@3.5: +python +netcdf +hdf5 +arrow"
    - "py-dask"
    - "py-rioxarray@0.19:"
    - "py-rasterio"
    - "py-cftime"
    - "py-pyproj"
    - "esmf +python"
    - "py-mpi4py"
    - "py-zarr@0.16:"
    - "py-crc32c"
    - 'py-deprecated'
    - "py-natsort"
  view: ./view-pychm
